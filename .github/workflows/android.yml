name: Build Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          # The runner already has the Android SDK. This only makes sure its licenses are accepted.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install and build the web app
        run: |
          npm install
          npm run build

      - name: Create the Android project
        run: |
          npx cap add android
          # Icons are nice to have. If this step ever fails the app still builds with a default icon.
          npx --yes @capacitor/assets generate --android || echo "Icon generation skipped"
          npx cap sync android

      - name: Set the version (each build is newer than the last)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.5.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build a signed APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cd android
          ./gradlew assembleRelease
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$GITHUB_WORKSPACE/Slipbook.apk" \
            "$RUNNER_TEMP/aligned.apk"

      - name: Build a test APK (no signing key set up yet)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          cd android
          ./gradlew assembleDebug
          # Same file name as the signed build, so the download link on the website never changes.
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Slipbook.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Slipbook-apk
          path: Slipbook.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: Slipbook.apk

  # Publishes the download website (site/) and the web version of the app (at /app/) to GitHub Pages.
  # Needs a PUBLIC repository and Settings > Pages > Source: GitHub Actions.
  # If Pages is not switched on yet this job fails, but it never stops the APK build above.
  pages:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the web app
        run: |
          npm install
          npm run build

      - name: Put the website and the app together
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r dist/. _site/app/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
